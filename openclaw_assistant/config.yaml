name: OpenClaw Super Home Assistant
version: "0.7.16"
slug: openclaw_super_home_assistant
description: Run the GitDakky OpenClaw fork as a Home Assistant app with migration support.
url: https://github.com/GitDakky/OpenClawHomeAssistant
image: "ghcr.io/gitdakky/openclaw-super-home-assistant"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
host_network: true

# Home Assistant Ingress (UI inside the add-on page)
ingress: true
ingress_port: 48109
panel_title: OpenClaw Super HA
panel_icon: mdi:robot

map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    path: /ha-config
    read_only: false
  - type: all_addon_configs
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
options:
  timezone: "Europe/Sofia"

  # Enable web terminal inside Home Assistant (Ingress) via ttyd
  enable_terminal: true

  # Terminal port (change if 7682 conflicts with another service)
  terminal_port: 7682

  # Public base URL for opening the Gateway Web UI in a new tab (not embedded).
  # Recommended: NO trailing slash.
  # Example: "https://example.duckdns.org:12345" or "http://192.168.1.10:18790"
  gateway_public_url: ""

  # Optional: Home Assistant long-lived token (for local HA API scripts/tools)
  homeassistant_token: ""

  # Enable the built-in Home Assistant MCP server that exposes live HA entities,
  # devices, areas, automations, services, and history directly to OpenClaw.
  # Read tools are enabled by default and use the add-on's trusted HA context.
  enable_builtin_ha_tools: true

  # Allow mutating Home Assistant service calls through the built-in HA tool layer.
  # This keeps read-only HA access available by default while leaving writes opt-in.
  enable_ha_service_calls: false

  # Optional: outbound HTTP/HTTPS proxy for OpenClaw network access.
  # Example: "http://192.168.2.1:3128"
  http_proxy: ""

  # Optional: Router SSH defaults (leave empty if you don't need router automation)
  # This is a generic SSH configuration intended for a router/firewall or any network device
  # reachable from inside the HA host LAN.
  router_ssh_host: ""
  router_ssh_user: ""
  router_ssh_key_path: "/data/keys/router_ssh"

  # Cleanup stale session lock files left after crashes/restarts
  clean_session_locks_on_start: true
  clean_session_locks_on_exit: true

  # Gateway mode:
  # - local: Run gateway locally (recommended for most users)
  # - remote: Connect to a remote gateway
  # Default is local.
  gateway_mode: local

  # Remote gateway URL (used when gateway_mode=remote)
  # Example: "ws://192.168.1.20:18790" or "wss://gateway.example.com:443"
  gateway_remote_url: ""

  # Gateway network bind mode:
  # - loopback: bind to 127.0.0.1 only (local access only, most secure)
  # - lan: bind to all interfaces (accessible from local network)
  # - tailnet: bind to Tailscale IP only (accessible only via Tailscale — recommended for remote access)
  # Default is loopback for security.
  gateway_bind_mode: loopback

  # Gateway port to listen on
  gateway_port: 18790

  # Access mode preset — simplifies secure access configuration.
  # custom: use individual gateway_bind_mode / auth_mode settings (backward compatible)
  # local_only: loopback + token auth (Ingress / terminal only, most secure)
  # lan_https: Built-in HTTPS reverse proxy for LAN access (recommended for phones/tablets)
  # lan_reverse_proxy: LAN bind + trusted-proxy for an external reverse proxy (NPM, Caddy, …)
  # tailnet_https: Tailscale interface bind + token auth
  access_mode: custom

  # Gateway authentication mode:
  # - token: standard token auth (default)
  # - trusted-proxy: trust auth headers from configured reverse proxies
  gateway_auth_mode: token

  # Comma-separated trusted proxy IP/CIDR list for trusted-proxy mode.
  # Example: "127.0.0.1,192.168.88.0/24"
  gateway_trusted_proxies: ""

  # Additional allowed origins for gateway.controlUi.allowedOrigins.
  # Merged with built-in defaults and existing configured origins.
  # In lan_https mode, hostnames/IPs from these origins are also added to the
  # TLS certificate SAN so the cert is valid for custom domains.
  # Example: "https://ha.example.com:8443,capacitor://localhost"
  gateway_additional_allowed_origins: ""

  # In lan_https mode, disable per-device Control UI auth ceremony.
  # Default true (recommended) to avoid interactive pairing error 1008 on LAN.
  # Set false only if you explicitly want strict per-device approvals.
  controlui_disable_device_auth: true

  # Disable OpenClaw exec approval prompts for gateway/node host execution.
  # Default is ON because this fork is intended for uninterrupted Home Assistant automations.
  # When enabled, the add-on forces exec approvals defaults to security=full, ask=off,
  # askFallback=full and aligns tools.exec.host=gateway, tools.exec.security=full,
  # tools.exec.ask=off, and tools.exec.strictInlineEval=false.
  # Turn this OFF only if you explicitly want human approval prompts restored.
  disable_exec_approvals: true

  # Enable OpenAI-compatible Chat Completions API endpoint
  # When enabled, OpenClaw can be used as a conversation agent in HA Assist pipeline
  # via Extended OpenAI Conversation (HACS) or any OpenAI-compatible client
  enable_openai_api: false

  # Force IPv4-first DNS result ordering for Node fetch/network calls.
  # Most HAOS VMs lack IPv6 egress, causing web_fetch / Telegram timeouts.
  # Default: true (recommended). Set to false only if you need IPv6.
  force_ipv4_dns: true

  # Nginx access log verbosity:
  # full: log all requests (useful for debugging)
  # minimal: suppress repetitive HA health-check and polling requests (default)
  nginx_log_level: minimal

  # Environment variables to pass to the gateway process at startup.
  # Format: list of objects with name/value fields.
  # Example:
  #   gateway_env_vars:
  #     - name: OPENAI_API_KEY
  #       value: "sk-abc123"
  #     - name: LOG_LEVEL
  #       value: "debug"
  # Reserved keys are blocked to protect runtime/security
  # (e.g. PATH, HOME, NODE_OPTIONS, NODE_PATH, OPENCLAW_*, proxy vars).
  # Limits: max 50 variables, max key length 255 chars, max value length 10000 chars
  gateway_env_vars: []

  # Legacy external MCP auto-configuration for Home Assistant.
  # When enabled and homeassistant_token is set, registers HA's external MCP endpoint.
  # This is ignored when enable_builtin_ha_tools is enabled.
  auto_configure_mcp: false

  # Enable Context7-aware research posture for current docs.
  # When enabled, the workspace and bundled skills will instruct the agent to use Context7
  # if an API key is configured.
  enable_context7: false
  context7_api_key: ""

  # Optional Domotz integration credentials for network inventory correlation.
  domotz_api_key: ""
  domotz_site_id: ""

  # Optional GitHub token for direct issue creation in this repository.
  # Use a fine-grained token with Issues: write on GitDakky/OpenClawHomeAssistant.
  github_issues_token: ""

  # Matrix channel support.
  # Current OpenClaw Matrix defaults are fail-closed for rooms, which is awkward for
  # ad-hoc Home Assistant use. This add-on defaults Matrix rooms to groupPolicy=open
  # and autoJoin=always when enabled so users can invite the bot without separately
  # pre-whitelisting every room. Mention-gating still applies by default in OpenClaw.
  enable_matrix: false
  matrix_homeserver: ""
  matrix_allow_private_network: false
  matrix_user_id: ""
  matrix_access_token: ""
  matrix_password: ""
  matrix_encryption: false
  matrix_dm_policy: pairing
  matrix_dm_allow_from: ""
  matrix_group_policy: open
  matrix_group_allow_from: ""
  matrix_room_allowlist: ""
  matrix_auto_join: always

  # Optional external MQTT broker details (for example HiveMQ Cloud).
  # broker URL examples: mqtt://broker.local:1883 or mqtts://cluster.s2.eu.hivemq.cloud:8883
  mqtt_broker_url: ""
  mqtt_username: ""
  mqtt_password: ""

  # Enable BACnet discovery scaffolding and operator guidance.
  # This does not silently scan the network; it only enables the add-on's BACnet-aware
  # bootstrap, dashboard status, and skill pack.
  enable_bacnet_scout: false


schema:
  timezone: str
  enable_terminal: bool?
  terminal_port: int(1024,65535)?
  gateway_public_url: str?
  homeassistant_token: str?
  enable_builtin_ha_tools: bool?
  enable_ha_service_calls: bool?
  http_proxy: str?

  router_ssh_host: str
  router_ssh_user: str
  router_ssh_key_path: str

  clean_session_locks_on_start: bool?
  clean_session_locks_on_exit: bool?
  gateway_mode: list(local|remote)?
  gateway_remote_url: str?
  gateway_bind_mode: list(loopback|lan|tailnet)?
  gateway_port: int(1,65535)?
  access_mode: list(custom|local_only|lan_https|lan_reverse_proxy|tailnet_https)?
  gateway_auth_mode: list(token|trusted-proxy)?
  gateway_trusted_proxies: str?
  gateway_additional_allowed_origins: str?
  controlui_disable_device_auth: bool?
  disable_exec_approvals: bool?
  enable_openai_api: bool?
  force_ipv4_dns: bool?
  gateway_env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]*$)"
      value: str
  nginx_log_level: list(full|minimal)?
  auto_configure_mcp: bool?
  enable_context7: bool?
  context7_api_key: str?
  domotz_api_key: str?
  domotz_site_id: str?
  github_issues_token: str?
  enable_matrix: bool?
  matrix_homeserver: str?
  matrix_allow_private_network: bool?
  matrix_user_id: str?
  matrix_access_token: str?
  matrix_password: str?
  matrix_encryption: bool?
  matrix_dm_policy: list(pairing|allowlist|open|disabled)?
  matrix_dm_allow_from: str?
  matrix_group_policy: list(open|allowlist|disabled)?
  matrix_group_allow_from: str?
  matrix_room_allowlist: str?
  matrix_auto_join: list(always|allowlist|off)?
  mqtt_broker_url: str?
  mqtt_username: str?
  mqtt_password: str?
  enable_bacnet_scout: bool?
