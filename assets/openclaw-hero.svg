<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">OpenClaw Assistant hero banner</title>
  <desc id="heroDesc">Animated banner showing Home Assistant, a secure OpenClaw gateway, terminal access, and automation capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="48" x2="1184" y2="592" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131A"/>
      <stop offset="0.55" stop-color="#0D2630"/>
      <stop offset="1" stop-color="#13292B"/>
    </linearGradient>
    <linearGradient id="beam" x1="278" y1="352" x2="1012" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24D3B5" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#24D3B5"/>
      <stop offset="0.5" stop-color="#FF9C52"/>
      <stop offset="0.8" stop-color="#24D3B5"/>
      <stop offset="1" stop-color="#24D3B5" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#1B3E47" stroke-width="1"/>
    </pattern>
    <style>
      .ui {
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      .beam {
        stroke-dasharray: 18 16;
        animation: dash 8s linear infinite;
      }
      .pulse {
        transform-origin: center;
        animation: pulse 4.2s ease-in-out infinite;
      }
      .float-a {
        animation: driftA 13s ease-in-out infinite;
      }
      .float-b {
        animation: driftB 16s ease-in-out infinite;
      }
      .scan {
        animation: scan 6s ease-in-out infinite;
      }
      .orbit {
        animation: orbit 14s linear infinite;
        transform-origin: 900px 174px;
      }
      .glint {
        animation: glint 5.4s ease-in-out infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -680; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.96); opacity: 0.75; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      @keyframes driftA {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(12px); }
      }
      @keyframes driftB {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(14px) translateX(-10px); }
      }
      @keyframes scan {
        0%, 100% { transform: translateX(-22px); opacity: 0.35; }
        50% { transform: translateX(22px); opacity: 0.95; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(74px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(74px) rotate(-360deg); }
      }
      @keyframes glint {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)" opacity="0.25"/>
  <circle class="float-a" cx="123" cy="122" r="88" fill="#24D3B5" opacity="0.06"/>
  <circle class="float-b" cx="1120" cy="520" r="126" fill="#FF9C52" opacity="0.08"/>
  <circle class="float-a" cx="1032" cy="120" r="64" fill="#1CC9FF" opacity="0.08"/>

  <g class="ui">
    <text x="88" y="122" fill="#24D3B5" font-size="18" font-weight="700" letter-spacing="0.14em">HOME ASSISTANT ADD-ON</text>
    <text x="88" y="208" fill="#F7FBFC" font-size="62" font-weight="800">OpenClaw Assistant</text>
    <text x="88" y="258" fill="#C5D6DA" font-size="26" font-weight="500">Fast-moving fork for Home Assistant operators who need OpenClaw updates,</text>
    <text x="88" y="293" fill="#C5D6DA" font-size="26" font-weight="500">secure gateway access, and a real terminal in one add-on.</text>

    <g opacity="0.95">
      <rect x="88" y="350" width="176" height="108" rx="20" fill="#0F2027" stroke="#1F5057"/>
      <rect x="304" y="350" width="176" height="108" rx="20" fill="#0F2027" stroke="#1F5057"/>
      <rect x="520" y="350" width="176" height="108" rx="20" fill="#0F2027" stroke="#1F5057"/>
      <rect x="736" y="350" width="176" height="108" rx="20" fill="#0F2027" stroke="#1F5057"/>
      <rect x="952" y="350" width="176" height="108" rx="20" fill="#0F2027" stroke="#1F5057"/>

      <text x="112" y="388" fill="#F7FBFC" font-size="17" font-weight="700">HA Ingress UI</text>
      <text x="112" y="415" fill="#8EB1B9" font-size="14">Embedded landing page</text>
      <text x="112" y="435" fill="#8EB1B9" font-size="14">for setup and recovery</text>

      <text x="328" y="388" fill="#F7FBFC" font-size="17" font-weight="700">Secure Gateway</text>
      <text x="328" y="415" fill="#8EB1B9" font-size="14">Token auth, LAN HTTPS,</text>
      <text x="328" y="435" fill="#8EB1B9" font-size="14">reverse proxy, tailnet</text>

      <text x="544" y="388" fill="#F7FBFC" font-size="17" font-weight="700">Web Terminal</text>
      <text x="544" y="415" fill="#8EB1B9" font-size="14">ttyd inside Home Assistant</text>
      <text x="544" y="435" fill="#8EB1B9" font-size="14">for onboarding and ops</text>

      <text x="760" y="388" fill="#F7FBFC" font-size="17" font-weight="700">Automation Stack</text>
      <text x="760" y="415" fill="#8EB1B9" font-size="14">OpenAI API, MCP, skills,</text>
      <text x="760" y="435" fill="#8EB1B9" font-size="14">browser workflows</text>

      <text x="976" y="388" fill="#F7FBFC" font-size="17" font-weight="700">Persistent State</text>
      <text x="976" y="415" fill="#8EB1B9" font-size="14">Config, skills, workspace,</text>
      <text x="976" y="435" fill="#8EB1B9" font-size="14">tokens under /config</text>
    </g>
  </g>

  <path class="beam" d="M278 404H1012" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
  <circle class="pulse" cx="392" cy="404" r="9" fill="#24D3B5" filter="url(#softGlow)"/>
  <circle class="pulse" cx="608" cy="404" r="9" fill="#FF9C52" filter="url(#softGlow)"/>
  <circle class="pulse" cx="824" cy="404" r="9" fill="#24D3B5" filter="url(#softGlow)"/>

  <g transform="translate(864 86)">
    <circle cx="92" cy="92" r="86" fill="#0E1E24" stroke="#255C64"/>
    <circle cx="92" cy="92" r="56" fill="none" stroke="#1ABDE4" stroke-width="2" opacity="0.32"/>
    <circle class="scan" cx="92" cy="92" r="56" fill="none" stroke="#1ABDE4" stroke-width="4" stroke-linecap="round" stroke-dasharray="84 268"/>
    <circle class="orbit" cx="166" cy="92" r="9" fill="#FF9C52"/>
    <circle cx="92" cy="92" r="21" fill="#24D3B5" opacity="0.16"/>
    <circle class="pulse" cx="92" cy="92" r="12" fill="#24D3B5"/>
    <path d="M92 62V122" stroke="#DDF5F2" stroke-width="4" stroke-linecap="round"/>
    <path d="M62 92H122" stroke="#DDF5F2" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(100 505)">
    <rect x="0" y="0" width="340" height="56" rx="16" fill="#0E1A20" stroke="#214C55"/>
    <text class="ui" x="28" y="35" fill="#E7F3F5" font-size="18" font-weight="700">Mission:</text>
    <text class="ui" x="112" y="35" fill="#B8CED3" font-size="18">track OpenClaw faster and operate cleanly in HAOS</text>
  </g>

  <g class="glint">
    <path d="M1014 54L1044 84" stroke="#FFB16E" stroke-width="2" stroke-linecap="round"/>
    <path d="M1044 54L1014 84" stroke="#FFB16E" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
