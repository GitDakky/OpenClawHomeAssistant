name: Build add-on image

on:
  pull_request:
    paths:
      - ".github/workflows/build-addon.yaml"
      - "openclaw_assistant/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-addon.yaml"
      - "openclaw_assistant/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.normalize.outputs.description }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Read add-on metadata
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./openclaw_assistant"

      - name: Normalize metadata
        id: normalize
        env:
          RAW_DESCRIPTION: ${{ steps.info.outputs.description }}
          RAW_IMAGE: ${{ steps.info.outputs.image }}
          RAW_NAME: ${{ steps.info.outputs.name }}
          RAW_URL: ${{ steps.info.outputs.url }}
          RAW_VERSION: ${{ steps.info.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def clean(value: str) -> str:
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  return value[1:-1]
              return value

          image = clean(os.environ["RAW_IMAGE"])
          version = clean(os.environ["RAW_VERSION"])
          name = clean(os.environ["RAW_NAME"])
          description = clean(os.environ["RAW_DESCRIPTION"])
          url = clean(os.environ["RAW_URL"])

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              print(f"image_name={image.rsplit('/', 1)[-1]}", file=handle)
              print(f"registry_prefix={image.rsplit('/', 1)[0]}", file=handle)
              print(f"version={version}", file=handle)
              print(f"name={name}", file=handle)
              print(f"description={description}", file=handle)
              if url and url != "null":
                  print(f"url={url}", file=handle)
          PY

      - name: Prepare multi-arch build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./openclaw_assistant"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          version: ${{ needs.prepare.outputs.version }}

  publish-manifest:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
