configuration:
  timezone:
    name: Часова зона
    description: Часова зона за добавката (напр. Europe/Sofia, America/New_York)
  
  enable_terminal:
    name: Активиране на уеб терминал
    description: Активиране на уеб терминал бутона в Home Assistant (Ingress) чрез ttyd
  
  terminal_port:
    name: Порт на терминал
    description: Номер на порт за уеб терминала (по подразбиране - 7682). Променете, ако този порт е в конфликт с друга услуга.
  
  gateway_public_url:
    name: Публичен URL на Gateway
    description: Незадължителен override URL за Gateway уеб интерфейса. При повечето локални инсталации add-on-ът го открива автоматично от текущия Home Assistant host. Задайте го само ако ви трябва различен reverse-proxy, HTTPS или Tailscale hostname.
  
  homeassistant_token:
    name: Home Assistant токен
    description: Опционално - дълготраен токен на Home Assistant за локални API скриптове/инструменти

  enable_builtin_ha_tools:
    name: Активирай вградените Home Assistant инструменти
    description: "Когато е ВКЛ. (препоръчително), добавката регистрира локален Home Assistant MCP сървър, за да може OpenClaw да чете живи entities, devices, areas, automations, services и history без допълнителен token setup."

  enable_ha_service_calls:
    name: Разреши Home Assistant service calls
    description: "Когато е ВКЛ., вграденият Home Assistant tool layer добавя и mutating `ha_service_call` tool. Оставете го ИЗКЛ., освен ако изрично не искате OpenClaw да извиква Home Assistant услуги след одобрение от потребителя."

  http_proxy:
    name: Изходящ HTTP прокси
    description: Опционално - URL на прокси за изходящи HTTP/HTTPS заявки (пример - http://192.168.2.1:3128)
  
  router_ssh_host:
    name: SSH хост на рутер
    description: Опционално - SSH име на хост или IP адрес на рутер/защитна стена
  
  router_ssh_user:
    name: SSH потребител на рутер
    description: Опционално - SSH потребителско име за рутер/защитна стена
  
  router_ssh_key_path:
    name: Път до SSH ключ на рутер
    description: Път до SSH частен ключ за достъп до рутер (по подразбиране - /data/keys/router_ssh)
  
  clean_session_locks_on_start:
    name: Изчистване на заключвания при стартиране
    description: Изчистване на остарели заключващи файлове на сесии след срив/рестарт при стартиране на добавката
  
  clean_session_locks_on_exit:
    name: Изчистване на заключвания при изход
    description: Изчистване на заключващи файлове на сесии при нормално спиране на добавката
  
  gateway_mode:
    name: Режим на Gateway
    description: Режим на работа на Gateway - local (локално изпълнение на gateway, препоръчително) или remote (свързване към отдалечен gateway)
    options:
      local: "Локален (препоръчително)"
      remote: "Отдалечен"

  gateway_remote_url:
    name: URL на отдалечен Gateway
    description: WebSocket URL на отдалечения gateway, използван когато Gateway Mode е remote (пример - ws://192.168.1.20:18790 или wss://gateway.example.com:443)

  gateway_additional_allowed_origins:
    name: Допълнителни разрешени origins
    description: Допълнителни origins за Control UI, разделени със запетая; сливат се в gateway.controlUi.allowedOrigins при lan_https (пример - https://ha.example.com:8443,capacitor://localhost)

  controlui_disable_device_auth:
    name: Изключи device pairing за Control UI (lan_https)
    description: "Когато е ВКЛ. (препоръчително), задава gateway.controlUi.dangerouslyDisableDeviceAuth=true и пропуска одобрението по устройство, за да избегне error 1008 в LAN HTTPS режим. Остави ВКЛ. за домашна/доверена мрежа. Изключи само ако искаш стриктно pairing потвърждение за всеки нов браузър/устройство."

  disable_exec_approvals:
    name: Изключване на exec approval подсказките
    description: "Когато е ВКЛ., принуждава OpenClaw host exec approvals към security=full, ask=off, askFallback=full и подравнява tools.exec.host=gateway, tools.exec.security=full, tools.exec.ask=off и strictInlineEval=false. Този fork го оставя ВКЛ. по подразбиране, за да не спират автоматизациите за човешко approval. Изключете го само ако искате подсказките да се върнат."

  enable_matrix:
    name: Включи Matrix канал
    description: "Включва Matrix канал от настройките на Home Assistant. Когато е ВКЛ. и има конфигурирани homeserver и работещ вход, add-on-ът конфигурира channels.matrix в OpenClaw и ще се опита да осигури Matrix plugin."

  matrix_homeserver:
    name: Matrix homeserver
    description: "URL на Matrix homeserver, например https://matrix.example.org или http://matrix-synapse:8008 за частен Synapse."

  matrix_allow_private_network:
    name: Разреши частен Matrix homeserver
    description: "Когато е ВКЛ., позволява Matrix homeserver на localhost, LAN, Tailscale или вътрешно име. Нужно е за частни Synapse/Dendrite инсталации."

  matrix_user_id:
    name: Matrix User ID
    description: "Пълният Matrix user ID на бот акаунта, например @openclaw:example.org."

  matrix_access_token:
    name: Matrix access token
    description: "Предпочитаният Matrix метод за вход. Ако е зададен, add-on-ът записва channels.matrix.accessToken и игнорира matrix_password."

  matrix_password:
    name: Matrix password
    description: "Резервна Matrix парола, когато няма access token. Използвайте token или password."

  matrix_encryption:
    name: Matrix encryption
    description: "Включва Matrix end-to-end encryption за конфигурирания акаунт."

  matrix_dm_policy:
    name: Matrix DM политика
    description: "Политика за директни съобщения в Matrix. pairing е най-безопасната стойност по подразбиране, open позволява директни съобщения без pairing, allowlist ограничава DMs до одобрени потребители."

  matrix_dm_allow_from:
    name: Matrix DM allowlist
    description: "Matrix user IDs, разделени със запетая, които могат да пишат на бота когато DM policy е allowlist."

  matrix_group_policy:
    name: Matrix room политика
    description: "Политика за стаи в Matrix. open е най-лесният режим за ad-hoc покани, allowlist ограничава отговорите до стаите в Matrix Room Allowlist, disabled блокира room трафика."

  matrix_group_allow_from:
    name: Matrix room user allowlist
    description: "Незадължителни Matrix user IDs, разделени със запетая, които могат да предизвикват отговори в стаи."

  matrix_room_allowlist:
    name: Matrix room allowlist
    description: "Room IDs или aliases, разделени със запетая, използвани за room allowlist mode и auto-join allowlist mode."

  matrix_auto_join:
    name: Matrix auto-join
    description: "Политика за автоматично приемане на покани. always позволява покани без предварително whitelist-ване, allowlist приема само стаи от Matrix Room Allowlist, off изключва auto-join."

  gateway_bind_mode:
    name: Режим на свързване на Gateway
    description: Режим на мрежово свързване - loopback (само 127.0.0.1, най-сигурен), lan (всички интерфейси) или tailnet (само Tailscale интерфейс). Пренебрегва се от предварителните режими на достъп.
    options:
      loopback: "Loopback (само 127.0.0.1, най-сигурен)"
      lan: "LAN (всички интерфейси)"
      tailnet: "Tailnet (само Tailscale)"

  gateway_port:
    name: Порт на Gateway
    description: Номер на порт, на който OpenClaw gateway да слуша (по подразбиране - 18790)

  access_mode:
    name: Режим на достъп
    description: "Опростява настройката на сигурен достъп. Пренебрегва gateway_bind_mode и gateway_auth_mode, когато не е зададен на Потребителски."
    options:
      custom: "Потребителски (индивидуални настройки)"
      local_only: "Само локален (loopback + token, само Ingress)"
      lan_https: "LAN HTTPS (вграден HTTPS прокси — препоръчително за телефони)"
      lan_reverse_proxy: "LAN Reverse Proxy (външен прокси с trusted-proxy удостоверяване)"
      tailnet_https: "Tailscale HTTPS (Tailscale + token)"

  gateway_auth_mode:
    name: Режим на удостоверяване на Gateway
    description: Режим на удостоверяване - token (по подразбиране) или trusted-proxy (за HTTPS reverse proxy). Пренебрегва се, когато access_mode не е Потребителски.
    options:
      token: "Token (по подразбиране)"
      trusted-proxy: "Доверен прокси (за reverse proxy)"

  gateway_trusted_proxies:
    name: Доверени прокси на Gateway
    description: Списък с доверени прокси IP/CIDR, разделени със запетая, за trusted-proxy режим (пример - 127.0.0.1,192.168.88.0/24).

  enable_openai_api:
    name: Активиране на OpenAI API
    description: Активиране на OpenAI-съвместим Chat Completions ендпойнт. Позволява използването на OpenClaw като разговорен агент в HA Assist pipeline чрез Extended OpenAI Conversation (HACS) или всеки OpenAI-съвместим клиент.
  force_ipv4_dns:
    name: Принудителен IPv4 DNS ред
    description: Принудително задава IPv4-приоритет при DNS резолв. Повечето HAOS VM нямат IPv6 изход — предизвиква web_fetch и Telegram грешки. Препоръчително ВКЛЮЧЕНО (по подразбиране).
  nginx_log_level:
    name: Nginx ниво на логове
    description: "Подробност на логовете на nginx проксито. 'minimal' (по подразбиране) потиска повтарящи се HA health-check заявки. 'full' логва всичко."
    options:
      minimal: "Минимално (потискане на HA polling шум)"
      full: "Пълно (логване на всички заявки)"
  gateway_env_vars:
    name: Променливи на средата за Gateway
    description: Променливи на средата, предавани на OpenClaw gateway процеса при стартиране (списък от записи name/value в Home Assistant UI; макс. 50 променливи, ключове до 255 знака, стойности до 10000 знака).
  auto_configure_mcp:
    name: Автоматично конфигуриране на MCP за Home Assistant
    description: "Наследен външен MCP режим. Когато е ВКЛ. и Home Assistant Token е зададен, регистрира външния MCP endpoint на Home Assistant при стартиране. Игнорира се, когато вграденият Home Assistant tool layer е активиран."
  enable_context7:
    name: Активирай Context7 режим
    description: "Когато е ВКЛ., предварително зареденият workspace и skill pack инструктират асистента да използва Context7 за актуална документация, ако има API ключ."
  context7_api_key:
    name: Context7 API ключ
    description: Незадължително - API ключ за Context7 справки по документация
  domotz_api_key:
    name: Domotz API ключ
    description: Незадължително - API ключ за Domotz мрежов инвентар и мониторинг
  domotz_site_id:
    name: Domotz Site ID
    description: Незадължително - идентификатор на сайт заедно с Domotz API ключа
  github_issues_token:
    name: GitHub Issues Token
    description: Незадължително - fine-grained GitHub token с Issues write достъп за директно пускане на issue в GitDakky/OpenClawHomeAssistant
  mqtt_broker_url:
    name: MQTT Broker URL
    description: Незадължително - външен MQTT broker URL (пример - mqtts://cluster.s2.eu.hivemq.cloud:8883)
  mqtt_username:
    name: MQTT потребител
    description: Незадължително - потребител за конфигурирания MQTT broker
  mqtt_password:
    name: MQTT парола
    description: Незадължително - парола за конфигурирания MQTT broker
  enable_bacnet_scout:
    name: Активирай BACnet Scout
    description: "Когато е ВКЛ., добавя BACnet/IP насоки, статус в таблото и graph scaffolding. Не сканира мрежата тайно."
