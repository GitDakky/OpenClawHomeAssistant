<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">OpenClaw Super Home Assistant hero banner</title>
  <desc id="heroDesc">Animated banner for the GitDakky OpenClaw Super Home Assistant fork with a clearer identity and migration-ready messaging.</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07151C"/>
      <stop offset="0.55" stop-color="#0C2430"/>
      <stop offset="1" stop-color="#142F2D"/>
    </linearGradient>
    <linearGradient id="heroPanel" x1="790" y1="108" x2="1160" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#112831"/>
      <stop offset="1" stop-color="#0C1E27"/>
    </linearGradient>
    <linearGradient id="heroLine" x1="846" y1="290" x2="1094" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24D3B5"/>
      <stop offset="0.5" stop-color="#19BFE6"/>
      <stop offset="1" stop-color="#FF9C52"/>
    </linearGradient>
    <filter id="heroGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="heroGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#1C404B" stroke-width="1"/>
    </pattern>
    <style>
      .ui {
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#heroBg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#heroGrid)" opacity="0.22"/>

  <circle cx="114" cy="110" r="88" fill="#1CD0C5" opacity="0.07">
    <animate attributeName="cy" values="110;96;110" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="534" r="126" fill="#FF9C52" opacity="0.08">
    <animate attributeName="cx" values="1150;1120;1150" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1028" cy="116" r="70" fill="#19BFE6" opacity="0.08">
    <animate attributeName="cy" values="116;130;116" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g class="ui">
    <text x="86" y="116" fill="#29D8C4" font-size="18" font-weight="700" letter-spacing="0.14em">HOME ASSISTANT ADD-ON</text>
    <text x="86" y="198" fill="#F7FBFC" font-size="76" font-weight="800">OpenClaw Super</text>
    <text x="86" y="276" fill="#F7FBFC" font-size="72" font-weight="800">Home Assistant</text>
    <text x="86" y="332" fill="#C9D8DC" font-size="25" font-weight="500">GitDakky fork with a distinct identity and cleaner installs.</text>
    <text x="86" y="366" fill="#C9D8DC" font-size="25" font-weight="500">Secure access, persistence, and terminal control.</text>

    <g transform="translate(86 406)">
      <rect x="0" y="0" width="182" height="50" rx="16" fill="#0D1C23" stroke="#23525D"/>
      <text x="24" y="31" fill="#E8F4F6" font-size="18" font-weight="700">Secure gateway</text>
    </g>
    <g transform="translate(286 406)">
      <rect x="0" y="0" width="174" height="50" rx="16" fill="#0D1C23" stroke="#23525D"/>
      <text x="24" y="31" fill="#E8F4F6" font-size="18" font-weight="700">Embedded ttyd</text>
    </g>
    <g transform="translate(478 406)">
      <rect x="0" y="0" width="192" height="50" rx="16" fill="#0D1C23" stroke="#23525D"/>
      <text x="24" y="31" fill="#E8F4F6" font-size="18" font-weight="700">Persistent /config</text>
    </g>

    <g transform="translate(86 490)">
      <rect x="0" y="0" width="572" height="84" rx="22" fill="#0D1A20" stroke="#214A53"/>
      <text x="28" y="33" fill="#29D8C4" font-size="14" font-weight="700" letter-spacing="0.12em">FORK DIRECTION</text>
      <text x="28" y="58" fill="#D7E7EB" font-size="20" font-weight="600">Fork-specific branding, migration help,</text>
      <text x="28" y="82" fill="#D7E7EB" font-size="20" font-weight="600">and a sharper Home Assistant operator experience.</text>
    </g>
  </g>

  <g transform="translate(760 104)">
    <rect x="0" y="0" width="432" height="428" rx="28" fill="url(#heroPanel)" stroke="#285A63"/>

    <g transform="translate(34 34)">
      <text class="ui" x="0" y="18" fill="#FFB16E" font-size="15" font-weight="700" letter-spacing="0.1em">LIVE STACK</text>
      <text class="ui" x="0" y="54" fill="#F7FBFC" font-size="34" font-weight="800">GitDakky fork, wired for HAOS</text>
    </g>

    <g transform="translate(34 108)">
      <rect x="0" y="0" width="364" height="76" rx="22" fill="#112028" stroke="#244D57"/>
      <circle cx="34" cy="38" r="9" fill="#24D3B5" filter="url(#heroGlow)">
        <animate attributeName="r" values="8;10;8" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <text class="ui" x="60" y="34" fill="#F4FAFB" font-size="22" font-weight="700">Gateway access</text>
      <text class="ui" x="60" y="58" fill="#9DB8BE" font-size="16">token auth, LAN HTTPS, reverse proxy, tailnet</text>
    </g>

    <g transform="translate(34 206)">
      <rect x="0" y="0" width="364" height="76" rx="22" fill="#112028" stroke="#244D57"/>
      <circle cx="34" cy="38" r="9" fill="#19BFE6" filter="url(#heroGlow)">
        <animate attributeName="cy" values="38;34;38" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text class="ui" x="60" y="34" fill="#F4FAFB" font-size="22" font-weight="700">Operator terminal</text>
      <text class="ui" x="60" y="58" fill="#9DB8BE" font-size="16">embedded ttyd for onboarding, recovery, and live fixes</text>
    </g>

    <g transform="translate(34 304)">
      <rect x="0" y="0" width="364" height="76" rx="22" fill="#112028" stroke="#244D57"/>
      <circle cx="34" cy="38" r="9" fill="#FF9C52" filter="url(#heroGlow)">
        <animate attributeName="cx" values="34;38;34" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <text class="ui" x="60" y="34" fill="#F4FAFB" font-size="22" font-weight="700">Persistent runtime</text>
      <text class="ui" x="60" y="58" fill="#9DB8BE" font-size="16">skills, workspace, keys, and config survive image updates</text>
    </g>

    <line x1="86" y1="186" x2="334" y2="186" stroke="url(#heroLine)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 14">
      <animate attributeName="stroke-dashoffset" values="0;-224" dur="7s" repeatCount="indefinite"/>
    </line>
    <circle cx="150" cy="186" r="6" fill="#24D3B5" filter="url(#heroGlow)">
      <animate attributeName="cx" values="150;326;150" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
