<svg width="1280" height="460" viewBox="0 0 1280 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">OpenClaw Super Home Assistant architecture overview</title>
  <desc id="archDesc">Animated architecture diagram showing Home Assistant ingress, the GitDakky fork runtime, migration-aware startup, and persistent config storage.</desc>
  <defs>
    <linearGradient id="archBg" x1="20" y1="0" x2="1260" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131A"/>
      <stop offset="1" stop-color="#102930"/>
    </linearGradient>
    <linearGradient id="archFlow" x1="250" y1="320" x2="1038" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24D3B5"/>
      <stop offset="0.5" stop-color="#19BFE6"/>
      <stop offset="1" stop-color="#FF9C52"/>
    </linearGradient>
    <filter id="archSoftGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ui {
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <rect width="1280" height="460" rx="28" fill="url(#archBg)"/>

  <g class="ui">
    <text x="76" y="84" fill="#24D3B5" font-size="18" font-weight="700" letter-spacing="0.12em">RUNTIME MAP</text>
    <text x="76" y="130" fill="#F7FBFC" font-size="48" font-weight="800">How the GitDakky fork fits together</text>
    <text x="76" y="168" fill="#B7CED3" font-size="23">Ingress gets you in. nginx and ttyd keep the operator experience usable.</text>
    <text x="76" y="198" fill="#B7CED3" font-size="23">OpenClaw runs the gateway. Migration and persistent data stay under `/config`.</text>

    <g transform="translate(944 72)">
      <rect x="0" y="0" width="250" height="92" rx="22" fill="#0E1C23" stroke="#224A54"/>
      <text x="22" y="30" fill="#FFB16E" font-size="14" font-weight="700" letter-spacing="0.1em">ACCESS MODES</text>
      <text x="22" y="58" fill="#E5EFF2" font-size="18" font-weight="700">local_only  lan_https</text>
      <text x="22" y="80" fill="#E5EFF2" font-size="18" font-weight="700">lan_reverse_proxy  tailnet_https</text>
    </g>
  </g>

  <g class="ui" transform="translate(76 252)">
    <g>
      <rect x="0" y="0" width="208" height="120" rx="24" fill="#0E1C23" stroke="#224C56"/>
      <text x="24" y="40" fill="#F7FBFC" font-size="20" font-weight="700">Home Assistant</text>
      <text x="24" y="68" fill="#9CB9BF" font-size="16">Add-on page, config,</text>
      <text x="24" y="92" fill="#9CB9BF" font-size="16">logs, ingress entry</text>
    </g>

    <g transform="translate(254 0)">
      <rect x="0" y="0" width="220" height="120" rx="24" fill="#0E1C23" stroke="#224C56"/>
      <text x="24" y="40" fill="#F7FBFC" font-size="20" font-weight="700">nginx + ttyd</text>
      <text x="24" y="68" fill="#9CB9BF" font-size="16">Landing page, routing,</text>
      <text x="24" y="92" fill="#9CB9BF" font-size="16">embedded terminal</text>
    </g>

    <g transform="translate(528 0)">
      <rect x="0" y="0" width="248" height="120" rx="24" fill="#0E1C23" stroke="#224C56"/>
      <text x="24" y="40" fill="#F7FBFC" font-size="20" font-weight="700">OpenClaw Gateway</text>
      <text x="24" y="68" fill="#9CB9BF" font-size="16">Auth, Control UI, MCP,</text>
      <text x="24" y="92" fill="#9CB9BF" font-size="16">OpenAI-compatible API</text>
    </g>

    <g transform="translate(840 0)">
      <rect x="0" y="0" width="282" height="120" rx="24" fill="#0E1C23" stroke="#224C56"/>
      <text x="24" y="40" fill="#F7FBFC" font-size="20" font-weight="700">Persistent `/config`</text>
      <text x="24" y="68" fill="#9CB9BF" font-size="16">openclaw.json, skills, workspace,</text>
      <text x="24" y="92" fill="#9CB9BF" font-size="16">keys, tokens, and operator state</text>
    </g>
  </g>

  <line x1="284" y1="312" x2="328" y2="312" stroke="url(#archFlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 14">
    <animate attributeName="stroke-dashoffset" values="0;-112" dur="5s" repeatCount="indefinite"/>
  </line>
  <line x1="550" y1="312" x2="604" y2="312" stroke="url(#archFlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 14">
    <animate attributeName="stroke-dashoffset" values="0;-112" dur="5s" repeatCount="indefinite"/>
  </line>
  <line x1="852" y1="312" x2="916" y2="312" stroke="url(#archFlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 14">
    <animate attributeName="stroke-dashoffset" values="0;-112" dur="5s" repeatCount="indefinite"/>
  </line>

  <circle cx="306" cy="312" r="7" fill="#FF9C52" filter="url(#archSoftGlow)">
    <animate attributeName="cx" values="306;324;306" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="574" cy="312" r="7" fill="#24D3B5" filter="url(#archSoftGlow)">
    <animate attributeName="cx" values="574;598;574" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="312" r="7" fill="#19BFE6" filter="url(#archSoftGlow)">
    <animate attributeName="cx" values="880;910;880" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
