configuration:
  timezone:
    name: Fuso Horário
    description: Fuso horário do add-on (ex., America/Sao_Paulo, America/Fortaleza)
  
  enable_terminal:
    name: Habilitar Terminal Web
    description: Habilitar botão do terminal web dentro do Home Assistant (Ingress) via ttyd
  
  terminal_port:
    name: Porta do Terminal
    description: Número da porta para o terminal web (padrão - 7682). Altere se esta porta conflitar com outro serviço.
  
  gateway_public_url:
    name: URL Pública do Gateway
    description: URL opcional de override para abrir a interface web do Gateway. Na maioria das instalações locais o add-on detecta isso automaticamente a partir do host atual do Home Assistant. Configure apenas se precisar de um hostname diferente de reverse proxy, HTTPS ou Tailscale.
  
  homeassistant_token:
    name: Token do Home Assistant
    description: Opcional - Token de longa duração do Home Assistant para scripts/ferramentas da API local do HA

  enable_builtin_ha_tools:
    name: Habilitar ferramentas integradas do Home Assistant
    description: "Quando LIGADO (recomendado), o add-on registra um servidor MCP local do Home Assistant para que o OpenClaw possa ler entidades, dispositivos, áreas, automações, serviços e histórico ao vivo sem configuração extra de token."

  enable_ha_service_calls:
    name: Permitir chamadas de serviço do Home Assistant
    description: "Quando LIGADO, a camada integrada de ferramentas do Home Assistant também expõe a ferramenta mutável `ha_service_call`. Mantenha DESLIGADO a menos que você queira que o OpenClaw invoque serviços do Home Assistant após aprovação explícita do usuário."

  http_proxy:
    name: Proxy HTTP de saída
    description: Opcional - URL de proxy para requisições HTTP/HTTPS de saída (exemplo - http://192.168.2.1:3128)
  
  router_ssh_host:
    name: Host SSH do Roteador
    description: Opcional - Nome do host ou endereço IP do roteador/firewall via SSH
  
  router_ssh_user:
    name: Usuário SSH do Roteador
    description: Opcional - Nome de usuário SSH do roteador/firewall
  
  router_ssh_key_path:
    name: Caminho da Chave SSH do Roteador
    description: Caminho para a chave privada SSH para acesso ao roteador (padrão - /data/keys/router_ssh)
  
  clean_session_locks_on_start:
    name: Limpar Bloqueios de Sessão ao Iniciar
    description: Limpar arquivos de bloqueio de sessão obsoletos deixados após falhas/reinicializações quando o add-on iniciar
  
  clean_session_locks_on_exit:
    name: Limpar Bloqueios de Sessão ao Sair
    description: Limpar arquivos de bloqueio de sessão quando o add-on parar normalmente
  
  gateway_mode:
    name: Modo do Gateway
    description: Modo de operação do gateway - local (executar gateway localmente, recomendado) ou remote (conectar a um gateway remoto)
    options:
      local: "Local (recomendado)"
      remote: "Remoto"

  gateway_remote_url:
    name: URL do Gateway Remoto
    description: URL WebSocket do gateway remoto usada quando Gateway Mode está em Remote (exemplo - ws://192.168.1.20:18790 ou wss://gateway.example.com:443)

  gateway_additional_allowed_origins:
    name: Origens permitidas adicionais
    description: Origens extras da Control UI separadas por vírgula, mescladas em gateway.controlUi.allowedOrigins no modo lan_https (exemplo - https://ha.example.com:8443,capacitor://localhost)

  controlui_disable_device_auth:
    name: Desativar pareamento por dispositivo no Control UI (lan_https)
    description: "Quando LIGADO (recomendado), define gateway.controlUi.dangerouslyDisableDeviceAuth=true para pular aprovação por dispositivo e evitar erro 1008 no modo LAN HTTPS. Mantenha LIGADO em rede doméstica/confiável. Desligue apenas se quiser pareamento estrito para cada novo navegador/dispositivo."

  disable_exec_approvals:
    name: Desativar prompts de aprovação exec
    description: "Quando LIGADO, força as aprovações de exec do host do OpenClaw para security=full, ask=off, askFallback=full e alinha tools.exec.host=gateway, tools.exec.security=full, tools.exec.ask=off e strictInlineEval=false. Este fork deixa isso LIGADO por padrão para que automações não parem por aprovação humana. Desligue apenas se quiser restaurar os prompts."

  enable_matrix:
    name: Ativar canal Matrix
    description: "Ativa o suporte a Matrix nas configurações do Home Assistant. Quando LIGADO, o add-on configura channels.matrix no OpenClaw e tenta garantir que o plugin Matrix esteja disponível."

  matrix_homeserver:
    name: Homeserver Matrix
    description: "URL do homeserver Matrix, por exemplo https://matrix.example.org ou http://matrix-synapse:8008 para um Synapse privado."

  matrix_allow_private_network:
    name: Permitir homeserver Matrix privado
    description: "Quando LIGADO, permite homeservers Matrix em localhost, LAN, Tailscale ou nomes internos. Necessário para instalações privadas de Synapse/Dendrite."

  matrix_user_id:
    name: Matrix User ID
    description: "ID completo de usuário Matrix da conta do bot, por exemplo @openclaw:example.org."

  matrix_access_token:
    name: Token de acesso Matrix
    description: "Método preferido de autenticação Matrix. Se definido, o add-on grava channels.matrix.accessToken e ignora matrix_password."

  matrix_password:
    name: Senha Matrix
    description: "Senha de login Matrix de fallback quando nenhum token é fornecido. Use token ou senha."

  matrix_encryption:
    name: Criptografia Matrix
    description: "Ativa criptografia ponta a ponta do Matrix para a conta configurada."

  matrix_dm_policy:
    name: Política de DM do Matrix
    description: "Política de acesso a mensagens diretas do Matrix. pairing é o padrão mais seguro, open permite DMs sem pareamento e allowlist restringe a usuários aprovados."

  matrix_dm_allow_from:
    name: Allowlist de DM do Matrix
    description: "IDs de usuário Matrix separados por vírgula que podem enviar DM ao bot quando a política de DM é allowlist."

  matrix_group_policy:
    name: Política de salas Matrix
    description: "Política de acesso a salas Matrix. open é a opção mais fácil para convites ad hoc, allowlist limita respostas às salas em Matrix Room Allowlist, disabled bloqueia tráfego de salas."

  matrix_group_allow_from:
    name: Allowlist de usuários em salas Matrix
    description: "IDs de usuário Matrix opcionais, separados por vírgula, que podem disparar respostas em salas."

  matrix_room_allowlist:
    name: Allowlist de salas Matrix
    description: "IDs de sala ou aliases separados por vírgula usados para o modo de allowlist de salas e para o modo de auto-join allowlist."

  matrix_auto_join:
    name: Auto-join do Matrix
    description: "Política de auto-entrada em convites. always permite convidar o bot sem whitelist prévia, allowlist entra apenas em salas da Matrix Room Allowlist e off desativa o auto-join."

  gateway_bind_mode:
    name: Modo de Vinculação do Gateway
    description: Modo de vinculação de rede - loopback (somente 127.0.0.1, mais seguro), lan (todas as interfaces) ou tailnet (somente interface Tailscale). Substituído pelas predefinições do modo de acesso.
    options:
      loopback: "Loopback (somente 127.0.0.1, mais seguro)"
      lan: "LAN (todas as interfaces)"
      tailnet: "Tailnet (somente Tailscale)"

  gateway_port:
    name: Porta do Gateway
    description: Número da porta para o gateway do OpenClaw escutar (padrão - 18790)

  access_mode:
    name: Modo de Acesso
    description: "Simplifica a configuração de acesso seguro. Substitui gateway_bind_mode e gateway_auth_mode quando não definido como Personalizado."
    options:
      custom: "Personalizado (configurações individuais)"
      local_only: "Apenas local (loopback + token, apenas Ingress)"
      lan_https: "LAN HTTPS (proxy HTTPS integrado — recomendado para celulares)"
      lan_reverse_proxy: "LAN Reverse Proxy (proxy externo com auth trusted-proxy)"
      tailnet_https: "Tailscale HTTPS (Tailscale + token)"

  gateway_auth_mode:
    name: Modo de Autenticação do Gateway
    description: Modo de autenticação - token (padrão) ou trusted-proxy (para reverse proxies HTTPS). Substituído quando access_mode não é Personalizado.
    options:
      token: "Token (padrão)"
      trusted-proxy: "Proxy Confiável (para reverse proxies)"

  gateway_trusted_proxies:
    name: Proxies Confiáveis do Gateway
    description: Lista de IPs/CIDR de proxies confiáveis separados por vírgula para o modo trusted-proxy (exemplo - 127.0.0.1,192.168.88.0/24).

  enable_openai_api:
    name: Habilitar API OpenAI
    description: Habilitar endpoint de Chat Completions compatível com OpenAI. Permite usar o OpenClaw como agente de conversação no pipeline do HA Assist via Extended OpenAI Conversation (HACS) ou qualquer cliente compatível com OpenAI.
  force_ipv4_dns:
    name: Forçar ordem DNS IPv4
    description: Força prioridade IPv4 no DNS. A maioria das VMs HAOS não tem saída IPv6 — causa erros em web_fetch e Telegram. Recomendado LIGADO (padrão).
  nginx_log_level:
    name: Nível de log Nginx
    description: "Detalhamento do log de acesso do nginx. 'minimal' (padrão) suprime requisições repetitivas de health-check e polling do HA. 'full' registra tudo."
    options:
      minimal: "Mínimo (suprimir ruído de polling HA)"
      full: "Completo (registrar todas as requisições)"
  gateway_env_vars:
    name: Variáveis de Ambiente do Gateway
    description: Variaveis de ambiente passadas para o processo do gateway OpenClaw na inicializacao (lista de entradas name/value na UI do Home Assistant; maximo de 50 variaveis, chaves com ate 255 caracteres, valores com ate 10.000 caracteres).
  auto_configure_mcp:
    name: Configurar MCP automaticamente para o Home Assistant
    description: "Caminho legado de MCP externo. Quando LIGADO e o token do Home Assistant estiver definido, registra o endpoint MCP externo do Home Assistant na inicialização. Isso é ignorado quando a camada integrada de ferramentas do Home Assistant está habilitada."
  enable_context7:
    name: Ativar modo Context7
    description: "Quando LIGADO, o workspace e o pacote de skills instruem o assistente a usar o Context7 para documentação atual quando uma chave de API estiver configurada."
  context7_api_key:
    name: Chave de API do Context7
    description: Opcional - chave de API para consultas de documentação via Context7
  domotz_api_key:
    name: Chave de API do Domotz
    description: Opcional - chave de API para inventário de rede e monitoramento do Domotz
  domotz_site_id:
    name: ID do site Domotz
    description: Opcional - identificador do site usado com a chave de API do Domotz
  github_issues_token:
    name: Token de GitHub Issues
    description: Opcional - token fine-grained do GitHub com permissão Issues write para criar issues diretamente em GitDakky/OpenClawHomeAssistant
  mqtt_broker_url:
    name: URL do broker MQTT
    description: Opcional - URL de broker MQTT externo (exemplo - mqtts://cluster.s2.eu.hivemq.cloud:8883)
  mqtt_username:
    name: Usuário MQTT
    description: Opcional - usuário para o broker MQTT configurado
  mqtt_password:
    name: Senha MQTT
    description: Opcional - senha para o broker MQTT configurado
  enable_bacnet_scout:
    name: Ativar BACnet Scout
    description: "Quando LIGADO, adiciona orientação BACnet/IP, status no painel e base do grafo. Não faz varredura silenciosa da rede."
